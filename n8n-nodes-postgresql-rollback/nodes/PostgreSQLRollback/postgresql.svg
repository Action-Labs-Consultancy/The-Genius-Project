<?xml version="1.0" encoding="UTF-8"?>
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="postgresql-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5aa0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main elephant body -->
  <ellipse cx="30" cy="35" rx="20" ry="15" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Elephant trunk/head -->
  <path d="M15 25 Q10 20 8 25 Q6 30 10 32 Q15 30 20 28" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Eye -->
  <circle cx="12" cy="26" r="2" fill="#ffffff"/>
  <circle cx="12" cy="26" r="1" fill="#000000"/>
  
  <!-- Ear -->
  <ellipse cx="18" cy="22" rx="3" ry="5" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Database rollback symbol -->
  <g transform="translate(35, 25)">
    <!-- Rollback arrow -->
    <path d="M-5 0 Q-8 -3 -5 -6 L-3 -4 Q0 -7 5 -4 Q8 -2 5 2 Q2 4 -2 2 L-4 4 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <!-- Clock marks -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="-8" stroke="#fbbf24" stroke-width="1"/>
    <line x1="6" y1="0" x2="8" y2="0" stroke="#fbbf24" stroke-width="1"/>
    <line x1="0" y1="6" x2="0" y2="8" stroke="#fbbf24" stroke-width="1"/>
    <line x1="-6" y1="0" x2="-8" y2="0" stroke="#fbbf24" stroke-width="1"/>
  </g>
  
  <!-- Database symbol on body -->
  <g transform="translate(30, 35)">
    <ellipse cx="0" cy="-3" rx="6" ry="2" fill="#ffffff" opacity="0.8"/>
    <rect x="-6" y="-3" width="12" height="6" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="0" cy="3" rx="6" ry="2" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Legs -->
  <ellipse cx="22" cy="47" rx="3" ry="5" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1"/>
  <ellipse cx="30" cy="48" rx="3" ry="5" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1"/>
  <ellipse cx="38" cy="47" rx="3" ry="5" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Tail -->
  <path d="M48 35 Q52 32 54 35 Q52 38 48 37" fill="url(#postgresql-gradient)" stroke="#1e3a8a" stroke-width="1"/>
</svg>
