<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Design Test - Pure Black/Yellow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100vh;
            width: 100vw;
            background: #000000;
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-content {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            color: #FFD600;
            text-align: center;
            letter-spacing: -0.5px;
            margin: 0;
        }
        
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .input-field {
            width: 100%;
            height: 50px;
            background: transparent;
            border: 1px solid #333333;
            border-radius: 0;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 400;
            padding: 0 16px;
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .input-field:focus {
            border-color: #FFD600;
        }
        
        .input-field::placeholder {
            color: #888888;
        }
        
        .login-button {
            height: 50px;
            border: 1px solid #FFD600;
            border-radius: 0;
            font-size: 16px;
            font-weight: 400;
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            cursor: pointer;
            outline: none;
            background: #FFD600;
            color: #000000;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        
        .login-button:hover {
            background: #E6C200;
        }
        
        .login-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }
        
        .link {
            color: #FFD600;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        
        .link:hover {
            color: #E6C200;
        }
        
        .separator {
            color: #666666;
            font-size: 14px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000000;
        }
        
        .modal-content {
            background: #111111;
            border: 1px solid #333333;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .modal-content h2 {
            color: #FFD600;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            text-align: center;
        }
        
        .link-button {
            background: transparent;
            border: 1px solid #666666;
            color: #FFFFFF;
            height: 50px;
            font-size: 16px;
            font-weight: 400;
            font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        
        .link-button:hover {
            border-color: #FFD600;
            color: #FFD600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-content">
            <div class="brand">
                <h1>Action Labs</h1>
            </div>
            
            <form class="login-form">
                <input 
                    type="email" 
                    class="input-field" 
                    placeholder="Email" 
                    required
                />
                
                <input 
                    type="password" 
                    class="input-field" 
                    placeholder="Password" 
                    required
                />
                
                <button type="submit" class="login-button">
                    Sign In
                </button>
                
                <div class="login-links">
                    <a href="#" class="link" onclick="showForgotPassword()">
                        Forgot your password?
                    </a>
                    <span class="separator">•</span>
                    <a href="#" class="link" onclick="showRequestAccess()">
                        Request Access
                    </a>
                </div>
            </form>
            
            <!-- Forgot Password Modal -->
            <div id="forgotModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Reset Password</h2>
                    <form onsubmit="handleForgotPassword(event)">
                        <input 
                            type="email" 
                            class="input-field" 
                            placeholder="Enter your email"
                            id="forgotEmail"
                            required
                        />
                        <button type="submit" class="login-button">
                            Send Reset Link
                        </button>
                        <button type="button" class="link-button" onclick="closeForgotPassword()">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Request Access Modal -->
            <div id="requestModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Request Access</h2>
                    <form onsubmit="handleRequestAccess(event)">
                        <input 
                            type="text" 
                            class="input-field" 
                            placeholder="Full Name"
                            id="requestName"
                            required
                        />
                        <input 
                            type="email" 
                            class="input-field" 
                            placeholder="Email Address"
                            id="requestEmail"
                            required
                        />
                        <textarea 
                            class="input-field" 
                            placeholder="Reason for access request"
                            id="requestReason"
                            rows="3"
                            style="resize: vertical; height: auto; min-height: 80px;"
                        ></textarea>
                        <button type="submit" class="login-button">
                            Submit Request
                        </button>
                        <button type="button" class="link-button" onclick="closeRequestAccess()">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showForgotPassword() {
            document.getElementById('forgotModal').style.display = 'flex';
        }
        
        function closeForgotPassword() {
            document.getElementById('forgotModal').style.display = 'none';
            document.getElementById('forgotEmail').value = '';
        }
        
        function showRequestAccess() {
            document.getElementById('requestModal').style.display = 'flex';
        }
        
        function closeRequestAccess() {
            document.getElementById('requestModal').style.display = 'none';
            document.getElementById('requestName').value = '';
            document.getElementById('requestEmail').value = '';
            document.getElementById('requestReason').value = '';
        }
        
        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            
            // Simulate API call
            alert(`Password reset link sent to: ${email}`);
            closeForgotPassword();
        }
        
        function handleRequestAccess(event) {
            event.preventDefault();
            const name = document.getElementById('requestName').value;
            const email = document.getElementById('requestEmail').value;
            const reason = document.getElementById('requestReason').value;
            
            // Simulate API call
            alert(`Access request submitted for: ${name} (${email})`);
            closeRequestAccess();
        }
        
        // Close modals when clicking outside
        document.addEventListener('click', function(event) {
            const forgotModal = document.getElementById('forgotModal');
            const requestModal = document.getElementById('requestModal');
            
            if (event.target === forgotModal) {
                closeForgotPassword();
            }
            
            if (event.target === requestModal) {
                closeRequestAccess();
            }
        });
    </script>
</body>
</html>
