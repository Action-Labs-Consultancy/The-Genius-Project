<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Preview - The Genius Project (Consistent Theme)</title>
    <link rel="stylesheet" href="src/login-minimal.css">
</head>
<body>
    <div class="minimal-login-container">
        <div class="minimal-login-content">
            <div class="minimal-brand">
                <h1>The Genius Project</h1>
            </div>
            
            <form class="minimal-login-form">
                <div class="minimal-input-group">
                    <input class="minimal-input" type="email" placeholder="Email" required>
                </div>
                
                <div class="minimal-input-group">
                    <input class="minimal-input" type="password" placeholder="Password" required>
                </div>
                
                <button class="minimal-button minimal-button-primary" type="submit">
                    Sign In
                </button>
                
                <div class="minimal-links">
                    <button class="minimal-link" type="button">
                        Forgot Password?
                    </button>
                    <button class="minimal-link" type="button">
                        Request Access
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Example (Hidden by default) -->
    <div class="minimal-modal-overlay" style="display: none;">
        <div class="minimal-modal">
            <div class="minimal-modal-header">
                <h2>Reset Password</h2>
                <button class="minimal-close-button">×</button>
            </div>
            
            <form class="minimal-modal-form">
                <p class="minimal-modal-text">Enter your email to receive reset instructions.</p>
                
                <div class="minimal-input-group">
                    <input class="minimal-input" type="email" placeholder="Email address" required>
                </div>
                
                <div class="minimal-modal-actions">
                    <button type="button" class="minimal-button minimal-button-secondary">
                        Cancel
                    </button>
                    <button type="submit" class="minimal-button minimal-button-primary">
                        Send Reset Link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Simple interaction for preview
        document.querySelector('.minimal-close-button')?.addEventListener('click', () => {
            document.querySelector('.minimal-modal-overlay').style.display = 'none';
        });
        
        document.querySelector('.minimal-links .minimal-link')?.addEventListener('click', () => {
            document.querySelector('.minimal-modal-overlay').style.display = 'flex';
        });
    </script>
</body>
</html>
