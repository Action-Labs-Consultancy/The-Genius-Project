<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Marketing Funnel Content Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🚀 AI Marketing Funnel Generator</h1>
                <p>Generate tailored marketing content ideas powered by AI for every stage of your funnel</p>
            </div>
        </header>

        <main class="main">
            <div class="form-section">
                <form id="contentGeneratorForm" class="content-form">
                    <div class="form-group">
                        <label for="productName" class="form-label">Product or Campaign Name *</label>
                        <input 
                            type="text" 
                            id="productName" 
                            name="productName" 
                            class="form-input" 
                            placeholder="e.g., LaunchPad Pro Software"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="targetAudience" class="form-label">Target Audience *</label>
                        <input 
                            type="text" 
                            id="targetAudience" 
                            name="targetAudience" 
                            class="form-input" 
                            placeholder="e.g., Small business owners, Tech startups"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">Description or Features *</label>
                        <textarea 
                            id="description" 
                            name="description" 
                            class="form-textarea" 
                            placeholder="Describe your product, service, or campaign features..."
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="toneOfVoice" class="form-label">Tone of Voice *</label>
                            <select id="toneOfVoice" name="toneOfVoice" class="form-select" required>
                                <option value="">Select tone...</option>
                                <option value="Professional & Business">Professional & Business</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="platform" class="form-label">Platform *</label>
                            <select id="platform" name="platform" class="form-select" required>
                                <option value="">Select platform...</option>
                                <option value="LinkedIn (Professional)">LinkedIn (Professional)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="funnelStage" class="form-label">Funnel Stage *</label>
                        <select id="funnelStage" name="funnelStage" class="form-select" required>
                            <option value="">Select funnel stage...</option>
                            <option value="Awareness" data-description="People become aware of a problem they want to solve.">
                                Awareness - People become aware of a problem they want to solve
                            </option>
                            <option value="Consideration" data-description="Prospects start looking into different products or services that can solve their problems.">
                                Consideration - Prospects start looking into different solutions
                            </option>
                            <option value="Conversion" data-description="Prospects find a solution they like and become paying customers.">
                                Conversion - Prospects become paying customers
                            </option>
                            <option value="Loyalty" data-description="Customers continue to use the solution and recommend that product or service to other people.">
                                Loyalty - Customers continue using and recommend the solution
                            </option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="contentType" class="form-label">Content Type *</label>
                            <select id="contentType" name="contentType" class="form-select" required>
                                <option value="">Select content type...</option>
                                <option value="Blog Post">Blog Post</option>
                                <option value="Social Media Post">Social Media Post</option>
                                <option value="Email">Email</option>
                                <option value="Video">Video</option>
                                <option value="Infographic">Infographic</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="timeOption" class="form-label">Time Option *</label>
                            <select id="timeOption" name="timeOption" class="form-select" required>
                                <option value="">Select timeline...</option>
                                <option value="2 Weeks">2 Weeks</option>
                                <option value="1 Month">1 Month</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="submit-button" id="generateButton">
                        <span class="button-text">🎯 Generate Content Ideas</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h2>📋 Generated Content Ideas</h2>
                    <button class="copy-button" id="copyButton">📋 Copy Results</button>
                </div>
                <div class="results-content" id="resultsContent">
                    <!-- Generated content will appear here -->
                </div>
                <button class="generate-another" id="generateAnother">
                    ✨ Generate Another Idea
                </button>
            </div>

            <div class="error-section" id="errorSection" style="display: none;">
                <div class="error-content">
                    <h3>⚠️ Generation Failed</h3>
                    <p id="errorMessage"></p>
                    <button class="retry-button" id="retryButton">🔄 Try Again</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Powered by AI • Built for marketing professionals • Generate unlimited content ideas</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
